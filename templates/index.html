<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شیرز پرو اے آئی اس튜디오 - لیریکل سنگنگ انجن</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #030712, #1e1b4b);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .studio-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #4f46e5;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        h1 {
            text-align: center;
            color: #818cf8;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .badge {
            background: linear-gradient(45deg, #6366f1, #ec4899);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #cbd5e1;
        }
        textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #4f46e5;
            background: #0f172a;
            color: white;
            font-size: 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary { background: linear-gradient(45deg, #4f46e5, #9333ea); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-stop { background: #dc2626; color: white; }
        .btn-stop:hover { background: #b91c1c; }

        .output-section {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .lyrics-display {
            color: #38bdf8;
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 1.8;
            min-height: 120px;
            max-height: 220px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
        }
        .highlight {
            background: #4f46e5;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="studio-card">
    <div style="text-align: center;">
        <span class="badge">✨ شیراز جنریٹ ساؤنڈ - پرو اسٹوڈیو</span>
    </div>
    <h1>شیرز پرو اے آئی اس튜디오</h1>
    <div class="subtitle">چیٹ جی پی ٹی کے اردو گانوں کو ترنم اور لے کے ساتھ پڑھنے والا اسٹوڈیو</div>

    <label for="chatGptLyrics">📝 چیٹ جی پی ٹی سے کاپی کیا ہوا اردو گانا یہاں پیسٹ کریں:</label>
    <textarea id="chatGptLyrics" rows="4" placeholder="یہاں اپنا اردو گانا یا شاعری پیسٹ کریں..."></textarea>

    <label for="musicMood">🎵 گانے اور ترنم کا انداز (Vocal Mood):</label>
    <select id="musicMood">
        <option value="poetic">📜 کلاسیکل شاعری اور ترنم کا انداز</option>
        <option value="sad">🌧️ اداس اور دھیما صوفیانہ انداز (Sad & Slow)</option>
        <option value="energetic">🔥 جوشیلہ اور تال والا انداز (Rhythmic & Fast)</option>
    </select>

    <div class="btn-group">
        <button class="btn-primary" onclick="startSingingLyrics()">🎶 ترنم کے ساتھ گانا شروع کریں</button>
        <button class="btn-stop" onclick="stopSingingLyrics()">⏹️ آواز بند کریں</button>
    </div>

    <div class="output-section">
        <label style="color: #34d399;">🎧 لیرکس اور ریڈی ٹیشن آؤٹ پٹ:</label>
        <div id="resultLyrics" class="lyrics-display">چیٹ جی پی ٹی سے گانا لا کر یہاں پیسٹ کریں اور 'ترنم کے ساتھ گانا شروع کریں' کا بٹن دبائیں...</div>
    </div>
</div>

<script>
    let currentUtterances = [];

    function startSingingLyrics() {
        let lyrics = document.getElementById("chatGptLyrics").value.trim();
        let mood = document.getElementById("musicMood").value;
        let resultDiv = document.getElementById("resultLyrics");

        if (lyrics === "") {
            alert("براہ کرم پہلے چیٹ جی پی ٹی سے کاپی کیا ہوا گانا یہاں پیسٹ کریں!");
            return;
        }

        // سکرین پر لیرکس دکھائیں
        resultDiv.innerText = lyrics;

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // پرانی آواز روکیں

            let lines = lyrics.split('\n');
            let index = 0;

            function playNextLine() {
                if (index < lines.length) {
                    let line = lines[index].trim();
                    if (line === "") {
                        index++;
                        playNextLine();
                        return;
                    }

                    let utterance = new SpeechSynthesisUtterance(line);
                    utterance.lang = 'ur-PK'; // اردو زبان کا تلفظ

                    // موڈ کے حساب سے رفتار اور آواز کی موٹائی (Pitch & Rate)
                    if (mood === "sad") {
                        utterance.rate = 0.75; // دھیما اور اداس
                        utterance.pitch = 0.8;
                    } else if (mood === "energetic") {
                        utterance.rate = 1.1; // تیز اور جوشیلا
                        utterance.pitch = 1.25;
                    } else {
                        utterance.rate = 0.85; // ترنم والا کلاسیکل انداز
                        utterance.pitch = 1.15;
                    }

                    utterance.onend = function() {
                        index++;
                        setTimeout(playNextLine, 350); // مصرعوں کے درمیان خوبصورت میوزیکل پاز (Pause)
                    };

                    window.speechSynthesis.speak(utterance);
                }
            }

            playNextLine();
        } else {
            alert("معذرت، آپ کا براؤزر اسپیچ سنتھیسز کو سپورٹ نہیں کرتا۔");
        }
    }

    function stopSingingLyrics() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            alert("گانا روک دیا گیا ہے۔");
        }
    }
</script>

</body>
</html>
