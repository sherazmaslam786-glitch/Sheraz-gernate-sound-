<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شیرز پرو سنگنگ اسٹوڈیو</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #090d16;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .studio-card {
            background: #111827;
            border: 2px solid #ef4444;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        h2 { text-align: center; color: #f87171; margin-top: 0; }
        textarea, select {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #dc2626; background: #1f2937; color: white;
            font-size: 15px; margin-bottom: 15px; box-sizing: border-box;
        }
        .btn-box { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 14px; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer; color: white;
        }
        .btn-play { background: #dc2626; }
        .btn-stop { background: #374151; }
        .screen {
            background: #1f2937; border: 1px solid #374151;
            border-radius: 8px; padding: 15px; margin-top: 15px;
            color: #38bdf8; font-size: 16px; line-height: 1.6;
            white-space: pre-wrap; min-height: 80px; text-align: right;
        }
    </style>
</head>
<body>

<div class="studio-card">
    <h2>شیرز پرو اسٹوڈیو - سنگنگ انجن</h2>
    
    <label>📝 گانے کے بول یا شاعری یہاں لکھیں:</label>
    <textarea id="lyricsInput" rows="4" placeholder="یہاں گانا درج کریں..."></textarea>

    <label>🎵 گائیکی اور تال کا انداز:</label>
    <select id="tuneStyle">
        <option value="melodic">صوفیانہ ترنم اور لے</option>
        <option value="high">اونچی آواز اور تال</option>
        <option value="deep">دھیما اور درد والا انداز</option>
    </select>

    <div class="btn-box">
        <button class="btn btn-play" onclick="runStudioEngine()">🎶 گانا شروع کریں</button>
        <button class="btn btn-stop" onclick="stopStudioEngine()">⏹️ بند کریں</button>
    </div>

    <div class="screen" id="outputScreen">سسٹم تیار ہے...</div>
</div>

<script>
    let synth = window.speechSynthesis;
    let audioCtx = null;
    let beatInterval = null;

    function playMusicalBeats(style) {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let frequencies = style === 'high' ? [350, 520, 650, 800] : [200, 300, 400, 500];
            let i = 0;

            beatInterval = setInterval(() => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(frequencies[i % frequencies.length], audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
                i++;
            }, 500);
        } catch(e) {
            console.log(e);
        }
    }

    function runStudioEngine() {
        let text = document.getElementById("lyricsInput").value.trim();
        let style = document.getElementById("tuneStyle").value;
        let screen = document.getElementById("outputScreen");

        if (text === "") {
            alert("پہلے لیرکس لکھیں!");
            return;
        }

        synth.cancel();
        if (beatInterval) clearInterval(beatInterval);

        screen.innerText = text;

        playMusicalBeats(style);

        let utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ur-PK';

        if (style === "high") {
            utterance.rate = 1.0;
            utterance.pitch = 1.4;
        } else if (style === "deep") {
            utterance.rate = 0.8;
            utterance.pitch = 0.7;
        } else {
            utterance.rate = 0.9;
            utterance.pitch = 1.2;
        }

        utterance.onend = function() {
            if (beatInterval) clearInterval(beatInterval);
            screen.innerText += "\n\n✨ گائیکی مکمل ہو گئی!";
        };

        synth.speak(utterance);
    }

    function stopStudioEngine() {
        if (synth) synth.cancel();
        if (beatInterval) clearInterval(beatInterval);
        document.getElementById("outputScreen").innerText = "⏹️ روک دیا گیا۔";
    }
</script>

</body>
</html>
