<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شیرز پرو اے آئی اس튜디오 - Shiraz Pro AI Studio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #090d16, #1e1b4b);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .studio-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #4f46e5;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }
        h1 {
            text-align: center;
            color: #818cf8;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .badge {
            background: linear-gradient(45deg, #6366f1, #9333ea);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #cbd5e1;
        }
        textarea, select, input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #4f46e5;
            background: #0f172a;
            color: white;
            font-size: 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #4338ca; }
        .btn-success { background: #16a34a; color: white; }
        .btn-success:hover { background: #15803d; }
        .btn-secondary { background: #475569; color: white; }
        .btn-secondary:hover { background: #334155; }

        .output-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            min-height: 100px;
            max-height: 180px;
            overflow-y: auto;
            color: #e2e8f0;
            white-space: pre-wrap;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="studio-card">
    <div style="text-align: center;">
        <span class="badge">✨ جنید سراج & جنید ساؤنڈ - پرو اس튜디오</span>
    </div>
    <h1>شیرز پرو اے آئی اس튜디오</h1>
    <div class="subtitle">محفوظ فائر بیس اور ترنم کے ساتھ لیریکل اسپیچ انجن</div>

    <label for="phoneInput">فائر بیس فون نمبر (او ٹی پی تصدیق):</label>
    <div class="btn-group" style="margin-bottom: 15px;">
        <input type="text" id="phoneInput" placeholder="+923XXXXXXXXX" style="margin-bottom:0;">
        <button class="btn-primary" onclick="verifyFirebaseUser()" style="flex: 0.5;">تصدیق کریں</button>
    </div>

    <label for="lyricsInput">لیرکس یا شاعری درج کریں:</label>
    <textarea id="lyricsInput" rows="3" placeholder="یہاں اپنا گانا یا شاعری لکھیں..."></textarea>

    <label for="moodSelect">وائس موڈ اور انداز:</label>
    <select id="moodSelect">
        <option value="poetic">📜 شعر و شاعری کا کلاسیکل ترنم</option>
        <option value="sad">🌧️ اداس اور دھیما انداز (Sad & Slow)</option>
        <option value="energetic">🔥 جوش اور توانائی والا انداز (Energetic)</option>
    </select>

    <div class="btn-group">
        <button class="btn-success" onclick="playLyricalRecitation()">🎵 ترنم کے ساتھ سنیں</button>
        <button class="btn-secondary" onclick="copyText()">📋 کاپی</button>
        <button class="btn-secondary" onclick="downloadText()">📥 ڈاؤن لوڈ</button>
    </div>

    <label>اسٹوڈیو آؤٹ پٹ:</label>
    <div id="studioOutput" class="output-box">جنید سراج اسٹوڈیو تیار ہے...</div>
</div>

<script>
    // فائر بیس یوزر وریفیکیشن سیمولیشن
    async function verifyFirebaseUser() {
        let phone = document.getElementById("phoneInput").value.trim();
        if(phone === "") {
            alert("براہ کرم فون نمبر درج کریں!");
            return;
        }

        try {
            let response = await fetch('/api/verify-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone })
            });
            let data = await response.json();
            if(data.success) {
                alert("مبارک ہو! فون نمبر فائر بیس پر کامیابی سے وریفائی ہو گیا ہے۔");
            }
        } catch(e) {
            alert("کنکشن میں خرابی!");
        }
    }

    // ترنم اور سر کے ساتھ بولنے والا طاقتور اسپیچ انجن (لیریکل ریڈی ٹیشن)
    function playLyricalRecitation() {
        let text = document.getElementById("lyricsInput").value.trim();
        let mood = document.getElementById("moodSelect").value;
        let outputBox = document.getElementById("studioOutput");

        if (text === "") {
            alert("براہ کرم پہلے کچھ لیرکس یا شاعری لکھیں!");
            return;
        }

        outputBox.innerText = text;

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // پرانی آواز بند کریں

            let lines = text.split('\n');
            let index = 0;

            function speakLine() {
                if (index < lines.length) {
                    let line = lines[index].trim();
                    if (line === "") {
                        index++;
                        speakLine();
                        return;
                    }

                    let utterance = new SpeechSynthesisUtterance(line);
                    utterance.lang = 'ur-PK';

                    // موڈ کے مطابق رفتار اور پچ (Rate & Pitch)
                    if (mood === "sad") {
                        utterance.rate = 0.8;
                        utterance.pitch = 0.9;
                    } else if (mood === "energetic") {
                        utterance.rate = 1.1;
                        utterance.pitch = 1.3;
                    } else {
                        utterance.rate = 0.9;
                        utterance.pitch = 1.2; // ترنم والا انداز
                    }

                    utterance.onend = function() {
                        index++;
                        setTimeout(speakLine, 400); // مصرعوں کے درمیان خوبصورت وقفہ
                    };

                    window.speechSynthesis.speak(utterance);
                }
            }

            speakLine();
        } else {
            alert("معذرت، آپ کا براؤزر اسپیچ کو سپورٹ نہیں کرتا۔");
        }
    }

    function copyText() {
        let text = document.getElementById("lyricsInput").value;
        navigator.clipboard.writeText(text).then(() => {
            alert("لیرکس کاپی ہو گئے ہیں!");
        });
    }

    function downloadText() {
        let text = document.getElementById("lyricsInput").value;
        let blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        let link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'Shiraz_AI_Studio_Lyrics.txt';
        link.click();
    }
</script>

</body>
</html>
