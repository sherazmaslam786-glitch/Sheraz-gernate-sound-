
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiraz Luxury Sound AI</title>
    <style>
        body {
            background-color: #04060a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            border: 3px solid #ff0055;
            border-radius: 20px;
            background: #0f131f;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
        }
        h1 {
            font-size: 24px;
            color: #ff0055;
            margin-bottom: 10px;
        }
        p {
            color: #b0b8c8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid #00e5ff;
            object-fit: cover;
            margin-bottom: 20px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff0055, #ffcc00);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Shiraz Luxury Sound AI</h1>
        <p>Welcome to AI Music & Sound Studio</p>
        
        <!-- آپ کی تصویر کا نام -->
        <img src="1000019150.jpg" alt="Profile" class="profile-img">
        
        <br>
        <button class="btn" onclick="alert('پہلا قدم بالکل کامیاب ہو گیا ہے!')">Get Started ➔</button>
    </div>

</body>
</html>
