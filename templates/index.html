<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شیرز پرو اے آئی اس튜디오 - Suno/Udio پروڈکشن</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #030712, #1e1b4b);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .studio-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #4f46e5;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }
        h1 {
            text-align: center;
            color: #818cf8;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .badge {
            background: linear-gradient(45deg, #6366f1, #9333ea);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #cbd5e1;
        }
        textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #4f46e5;
            background: #0f172a;
            color: white;
            font-size: 15px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #4f46e5, #ec4899);
            color: white;
            transition: 0.3s;
            margin-bottom: 15px;
        }
        button:hover { opacity: 0.95; }
        .output-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            color: #e2e8f0;
            white-space: pre-wrap;
            font-size: 15px;
            line-height: 1.6;
        }
        audio {
            width: 100%;
            margin-top: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="studio-card">
    <div style="text-align: center;">
        <span class="badge">✨ جنید سراج & جنید ساؤنڈ - پرو اے آئی اسٹوڈیو</span>
    </div>
    <h1>شیرز پرو اے آئی اس튜디오</h1>
    <div class="subtitle">Suno & Udio سٹائل پروڈکشن - اصل سازوں اور دھن کے ساتھ</div>

    <label for="promptInput">گانے کا موضوع یا پراپمٹ (Prompt):</label>
    <textarea id="promptInput" rows="3" placeholder="یہاں لکھیں، مثلاً: محبت پر ایک شاندار اور دلکش ترانہ..."></textarea>

    <label for="moodSelect">میوزک موڈ اور اسٹوڈیو سٹائل:</label>
    <select id="moodSelect">
        <option value="poetic">📜 شعر و شاعری کا کلاسیکل ترنم</option>
        <option value="sad">🌧️ اداس اور دلگیر دھن (Sad Melody)</option>
        <option value="energetic">🔥 جوشیلہ اور ریتھمک گانا (Energetic Beat)</option>
    </select>

    <button onclick="generateSunoStyleMusic()">🎵 پرو اے آئی میوزک اور گانا جنریٹ کریں</button>

    <div class="output-box">
        <label style="color: #38bdf8; margin-bottom: 5px;">جنریٹ شدہ لیرکس:</label>
        <div id="lyricsResult">گانا تیار ہونے کے بعد لیرکس یہاں ظاہر ہوں گے...</div>
    </div>

    <div class="output-box" id="audioSection" style="display:none;">
        <label style="color: #34d399; margin-bottom: 5px;">اصل سازوں کے ساتھ آڈیو ٹریک:</label>
        <audio id="proAudioPlayer" controls></audio>
    </div>
</div>

<script>
    async function generateSunoStyleMusic() {
        let prompt = document.getElementById("promptInput").value.trim();
        let mood = document.getElementById("moodSelect").value;
        let lyricsResult = document.getElementById("lyricsResult");
        let audioSection = document.getElementById("audioSection");
        let audioPlayer = document.getElementById("proAudioPlayer");

        if (prompt === "") {
            alert("براہ کرم پہلے گانے کا موضوع درج کریں!");
            return;
        }

        lyricsResult.innerText = "اے آئی اسٹوڈیو ساز، دھن اور لیرکس تیار کر رہا ہے، براہ کرم انتظار کریں...";

        try {
            let response = await fetch('/api/generate-pro-music', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt, mood: mood })
            });

            let data = await response.json();
            if (data.success) {
                lyricsResult.innerText = data.lyrics;
                audioPlayer.src = data.audio_url;
                audioSection.style.display = "block";
                audioPlayer.play();
            } else {
                alert("میوزک جنریشن میں خرابی پیش آئی۔");
            }
        } catch (error) {
            console.error(error);
            alert("سرور سے رابطہ قائم نہیں ہو سکا۔");
        }
    }
</script>

</body>
                                                                                                                 </html>
