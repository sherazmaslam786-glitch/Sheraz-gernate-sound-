<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiraz Luxury Sound AI - سمارٹ اے آئی سٹوڈیو</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #05050b, #15132d);
            color: #f1f5f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(15, 23, 42, 0.92);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.4);
        }
        h1 {
            text-align: center;
            color: #d4af37;
            font-size: 26px;
            margin-bottom: 10px;
            font-weight: 800;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e2e8f0;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #334155;
            background: #020617;
            color: #fff;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #d4af37;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #b8860b, #d4af37);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .hidden {
            display: none;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: 500;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
        }
        .success { background: rgba(20, 83, 45, 0.5); color: #4ade80; border: 1px solid #166534; }
        .error { background: rgba(127, 29, 29, 0.5); color: #f87171; border: 1px solid #991b1b; }
        
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background: #16a34a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        .download-btn:hover { background: #15803d; }

        /* وائبریشن اور دھم دھماٹ کے لیے پلْسنگ اینیمیشن */
        @keyframes pulse-vibe {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            50% { transform: scale(1.02); box-shadow: 0 0 20px 10px rgba(212, 175, 55, 0.2); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
        }
        .vibrating {
            animation: pulse-vibe 0.8s infinite;
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h1>Shiraz Luxury Sound AI</h1>
    <div class="subtitle">آٹومیٹک زبان کی شناخت اور دل دہلا دینے والا سمارٹ سٹوڈیو</div>

    <!-- سٹیپ 1: فون نمبر -->
    <div id="step-phone" class="form-group">
        <label for="phone">موبائل نمبر درج کریں:</label>
        <input type="text" id="phone" placeholder="مثلاً: 03001234567">
        <button onclick="sendOtp()" style="margin-top: 15px;">او ٹی پی (OTP) حاصل کریں</button>
    </div>

    <!-- سٹیپ 2: او ٹی پی ویریفیکیشن -->
    <div id="step-otp" class="form-group hidden">
        <label for="otp">تصدیقی کوڈ (OTP):</label>
        <input type="text" id="otp" placeholder="کوڈ یہاں درج کریں">
        <button onclick="verifyOtp()" style="margin-top: 15px;">تصدیق کریں</button>
    </div>

    <!-- سٹیپ 3: سمارٹ لیرکس سٹوڈیو -->
    <div id="step-studio" class="hidden">
        <div class="form-group">
            <label for="lyrics">شاعری یا الفاظ درج کریں (مثلاً: غم کی طرح یا جوشیلا ڈھول بیٹ):</label>
            <textarea id="lyrics" rows="5" placeholder="اپنے الفاظ یہاں لکھیں، سسٹم خود زبان اور موڈ پہچان لے گا..."></textarea>
        </div>
        <button onclick="generateMusic()">سمارٹ شاہانہ گانا جنریٹ کریں</button>
    </div>

    <div id="message"></div>

    <div id="audio-result" style="margin-top: 20px; text-align: center;" class="hidden">
        <p id="result-info" style="color: #4ade80; font-weight: bold; font-size: 14px;"></p>
        <audio id="audio-player" controls style="width: 100%; margin-top: 10px; border-radius: 8px;"></audio>
        <a id="download-link" href="#" class="download-btn" download="Shiraz_Luxury_Song.mp3">گانا ڈائریکٹ ڈاؤن لوڈ کریں (Download)</a>
    </div>
</div>

<script>
    let userPhone = "";

    function showMessage(text, type) {
        const msg = document.getElementById('message');
        msg.innerText = text;
        msg.className = type;
    }

    async function sendOtp() {
        userPhone = document.getElementById('phone').value.trim();
        if (!userPhone) {
            showMessage("براہ کرم درست فون نمبر لکھیں!", "error");
            return;
        }

        try {
            let res = await fetch('/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: userPhone })
            });
            let data = await res.json();
            if (res.ok) {
                showMessage(data.message, "success");
                document.getElementById('step-phone').classList.add('hidden');
                document.getElementById('step-otp').classList.remove('hidden');
            } else {
                showMessage(data.message, "error");
            }
        } catch (err) {
            showMessage("سرور سے رابطہ قائم نہیں ہو سکا!", "error");
        }
    }

    async function verifyOtp() {
        let otpCode = document.getElementById('otp').value.trim();
        if (!otpCode) {
            showMessage("تصدیقی کوڈ درج کرنا لازمی ہے!", "error");
            return;
        }

        try {
            let res = await fetch('/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: userPhone, otp: otpCode })
            });
            let data = await res.json();
            if (res.ok) {
                showMessage(data.message, "success");
                document.getElementById('step-otp').classList.add('hidden');
                document.getElementById('step-studio').classList.remove('hidden');
            } else {
                showMessage(data.message, "error");
            }
        } catch (err) {
            showMessage("تصدیق کے عمل میں خرابی آگئی!", "error");
        }
    }

    async function generateMusic() {
        let lyrics = document.getElementById('lyrics').value.trim();
        if (!lyrics) {
            showMessage("براہ کرم شاعری یا الفاظ درج کریں!", "error");
            return;
        }

        showMessage("اے آئی زبان اور موڈ کا تجزیہ کر کے دھم دھماٹ ٹریک تیار کر رہا ہے...", "success");

        try {
            let res = await fetch('/generate-music', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: userPhone, lyrics: lyrics })
            });
            let data = await res.json();

            if (res.status === 403) {
                showMessage(data.message, "error");
                return;
            }

            if (res.ok) {
                showMessage(data.message, "success");
                document.getElementById('audio-result').classList.remove('hidden');
                document.getElementById('result-info').innerText = `شناخت شدہ زبان: ${data.detected_lang} | موڈ: ${data.detected_mood}`;
                document.getElementById('audio-player').src = data.audio_url;
                document.getElementById('download-link').href = data.audio_url;

                // اگر جوشیلا یا ڈھول بیٹ ہو تو موبائل/سکرین پر ہلکی وائبریشن اثرات (پلسنگ) شروع کریں
                if (data.detected_mood.includes("دھم دھماٹ") && "vibrate" in navigator) {
                    navigator.vibrate([200, 100, 200, 100, 400]); // ہارڈویئر وائبریشن
                }
                
                const container = document.getElementById('main-container');
                container.classList.add('vibrating');
                setTimeout(() => container.classList.remove('vibrating'), 4000);

            } else {
                showMessage(data.message, "error");
            }
        } catch (err) {
            showMessage("سسٹم میں تکنیکی خرابی ہوگئی!", "error");
        }
    }
</script>

</body>
</html>
