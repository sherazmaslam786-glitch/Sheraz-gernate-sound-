<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شیرز پرو اے آئی اس튜디오 - سونو سٹائل میوزک جنریٹر</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #030712, #1e1b4b);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .studio-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #4f46e5;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        h1 {
            text-align: center;
            color: #818cf8;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .badge {
            background: linear-gradient(45deg, #6366f1, #ec4899);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #cbd5e1;
        }
        textarea, select, input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #4f46e5;
            background: #0f172a;
            color: white;
            font-size: 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #4f46e5, #9333ea);
            color: white;
            transition: 0.3s;
            margin-bottom: 15px;
        }
        button:hover { opacity: 0.9; }
        .output-section {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        audio {
            width: 100%;
            margin-top: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="studio-card">
    <div style="text-align: center;">
        <span class="badge">✨ شیراز جنریٹ ساؤنڈ - پرو اے آئی اسٹوڈیو</span>
    </div>
    <h1>شیرز پرو اے آئی اس튜디오</h1>
    <div class="subtitle">چیٹ جی پی ٹی کے اردو لیرکس سے اصلی سازوں والا گانا تیار کریں</div>

    <label for="chatGptLyrics">📝 چیٹ جی پی ٹی سے کاپی کیا ہوا اردو گانا یہاں پیسٹ کریں:</label>
    <textarea id="chatGptLyrics" rows="4" placeholder="یہاں اپنا اردو گانا یا شاعری پیسٹ کریں..."></textarea>

    <label for="musicMood">🎵 میوزک اور وائس موڈ (Music Style):</label>
    <select id="musicMood">
        <option value="poetic">📜 شعر و شاعری کا کلاسیکل ترنم</option>
        <option value="sad">🌧️ اداس اور دلگیر دھن (Sad Melody)</option>
        <option value="energetic">🔥 جوشیلہ اور ریتھمک گانا (Energetic Beat)</option>
    </select>

    <button onclick="generateSongFromLyrics()">🎶 اصل سازوں اور میوزک کے ساتھ گانا جنریٹ کریں</button>

    <div class="output-section">
        <label style="color: #38bdf8;">ترتیب شدہ لیرکس:</label>
        <div id="resultLyrics" style="color: #cbd5e1; white-space: pre-wrap; font-size: 15px; margin-bottom: 10px;">گانا جنریٹ ہونے کے بعد یہاں لیرکس آئیں گے...</div>
        
        <label style="color: #34d399;">🎧 اصلی سازوں والا آڈیو پلیئر (گانا سنیں):</label>
        <audio id="audioPlayer" controls style="display:none;"></audio>
    </div>
</div>

<script>
    async function generateSongFromLyrics() {
        let lyrics = document.getElementById("chatGptLyrics").value.trim();
        let mood = document.getElementById("musicMood").value;
        let resultLyrics = document.getElementById("resultLyrics");
        let audioPlayer = document.getElementById("audioPlayer");

        if (lyrics === "") {
            alert("براہ کرم پہلے چیٹ جی پی ٹی سے کاپی کیا ہوا گانا یہاں پیسٹ کریں!");
            return;
        }

        resultLyrics.innerText = "اے آئی اسٹوڈیو آپ کے اردو لیرکس پر دھن اور ساز تیار کر رہا ہے، براہ کرم انتظار کریں...";

        try {
            let response = await fetch('/api/generate-pro-music', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lyrics: lyrics, mood: mood })
            });

            let data = await response.json();
            if (data.success) {
                resultLyrics.innerText = data.lyrics;
                audioPlayer.src = data.audio_url;
                audioPlayer.style.display = "block";
                audioPlayer.play();
            } else {
                alert("جنریشن میں خرابی پیش آئی۔");
            }
        } catch (error) {
            console.error(error);
            alert("سرور سے رابطہ قائم نہیں ہو سکا۔");
        }
    }
</script>

</body>
</html>
