<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شیرز پرو سیلف-میڈ اے آئی اسٹوڈیو</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1e1b4b, #030712);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .studio-box {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #a855f7;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
        }
        h1 { text-align: center; color: #c084fc; margin-bottom: 5px; font-size: 26px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .badge {
            background: linear-gradient(45deg, #a855f7, #ec4899);
            color: white; padding: 5px 15px; border-radius: 20px;
            font-size: 12px; display: inline-block; margin-bottom: 15px; font-weight: bold;
        }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #cbd5e1; }
        textarea, select {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid #7e22ce; background: #0f172a; color: white;
            font-size: 15px; margin-bottom: 15px; box-sizing: border-box;
        }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn {
            flex: 1; padding: 14px; border: none; border-radius: 10px;
            font-size: 16px; font-weight: bold; cursor: pointer; color: white;
            transition: 0.3s;
        }
        .btn-sing { background: linear-gradient(45deg, #9333ea, #db2777); }
        .btn-stop { background: #dc2626; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .visualizer {
            background: #0f172a; border: 1px solid #334155;
            border-radius: 12px; padding: 15px; margin-top: 15px; text-align: center;
        }
        .lyrics-screen {
            background: rgba(15, 23, 42, 0.8); border-radius: 8px;
            padding: 15px; color: #38bdf8; font-size: 18px; line-height: 1.8;
            white-space: pre-wrap; text-align: right; min-height: 100px;
            border: 1px dashed #a855f7;
        }
        .status-text { color: #4ade80; font-weight: bold; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="studio-box">
    <div style="text-align: center;">
        <span class="badge">🚀 آزاد اور خودکار اے آئی سنگنگ انجن</span>
    </div>
    <h1>شیرز پرو اسٹوڈیو</h1>
    <div class="subtitle">بغیر کسی بیرونی اے پی آئی کے خودکار ترنم اور گائیکی کا نظام</div>

    <label>📝 اپنا گانا، نعت یا شاعری یہاں لکھیں:</label>
    <textarea id="userInputLyrics" rows="4" placeholder="یہاں شعر یا گانے کے بول درج کریں..."></textarea>

    <label>🎵 گائیکی کا انداز (ترنم):</label>
    <select id="singingStyle">
        <option value="romantic">رومانوی و صوفیانہ ترنم</option>
        <option value="sad">درد اور دھیما انداز</option>
        <option value="fast">جوشیلہ اور تال والا انداز</option>
    </select>

    <div class="btn-group">
        <button class="btn btn-sing" onclick="startSelfMadeAI()">🎶 خودکار گانا شروع کریں</button>
        <button class="btn btn-stop" onclick="stopEverything()">⏹️ روکیں</button>
    </div>

    <div class="visualizer">
        <label style="color: #c084fc; margin-bottom: 8px;">🎤 لائیو پرفارمنس اسکرین:</label>
        <div id="lyricsScreen" class="lyrics-screen">گانے کے بول یہاں سکرین پر چمکیں گے...</div>
        <div id="statusText" class="status-text">اسٹوڈیو تیار ہے...</div>
    </div>
</div>

<script>
    let synth = window.speechSynthesis;
    let currentUtterance = null;
    let backgroundMusicInterval = null;

    // خودکار ہلکی پھلکی میوزیکل تال پیدا کرنے کا فنکشن (Web Audio API)
    function playBackgroundBeats(style) {
        try {
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let notes = style === 'fast' ? [300, 450, 600, 750] : [220, 330, 440, 550];
            let index = 0;

            backgroundMusicInterval = setInterval(() => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = style === 'romantic' ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(notes[index % notes.length], audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
                index++;
            }, 600);
        } catch(e) {
            console.log("Audio Context info:", e);
        }
    }

    function startSelfMadeAI() {
        let text = document.getElementById("userInputLyrics").value.trim();
        let style = document.getElementById("singingStyle").value;
        let screen = document.getElementById("lyricsScreen");
        let status = document.getElementById("statusText");

        if (text === "") {
            alert("پہلے کچھ لکھیں تو سہی!");
            return;
        }

        synth.cancel();
        if (backgroundMusicInterval) clearInterval(backgroundMusicInterval);

        screen.innerText = text;
        status.innerText = "🎶 خودکار اے آئی گانا گا رہا ہے...";

        // بیک گراؤنڈ میوزک تال شروع کریں
        playBackgroundBeats(style);

        currentUtterance = new SpeechSynthesisUtterance(text);
        currentUtterance.lang = 'ur-PK'; // اردو زبان کی سیٹنگ

        if (style === "sad") {
            currentUtterance.rate = 0.75;
            currentUtterance.pitch = 0.7;
        } else if (style === "fast") {
            currentUtterance.rate = 1.1;
            currentUtterance.pitch = 1.3;
        } else {
            currentUtterance.rate = 0.85; // ترنم والا دھیما پن
            currentUtterance.pitch = 1.1; // مدھر آواز کا ارتعاش
        }

        currentUtterance.onend = function() {
            status.innerText = "✨ گانا مکمل ہو گیا!";
            if (backgroundMusicInterval) clearInterval(backgroundMusicInterval);
        };

        currentUtterance.onerror = function() {
            status.innerText = "❌ کوئی خامی پیش آئی۔";
            if (backgroundMusicInterval) clearInterval(backgroundMusicInterval);
        };

        synth.speak(currentUtterance);
    }

    function stopEverything() {
        if (synth) {
            synth.cancel();
        }
        if (backgroundMusicInterval) {
            clearInterval(backgroundMusicInterval);
        }
        document.getElementById("statusText").innerText = "⏹️ روک دیا گیا۔";
    }
</script>

</body>
</html>
