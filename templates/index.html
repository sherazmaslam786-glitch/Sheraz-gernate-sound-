<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شیرز پرو اے آئی اس튜디오 - پروفیشنل میوزک</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #090d16, #1e1b4b);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .studio-box {
            background: rgba(30, 27, 75, 0.85);
            border: 1px solid #4338ca;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        h1 {
            text-align: center;
            color: #818cf8;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #c7d2fe;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .badge {
            background: linear-gradient(45deg, #6366f1, #4f46e5);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #e2e8f0;
        }
        textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #4f46e5;
            background: #0f172a;
            color: white;
            font-size: 15px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #4f46e5, #9333ea);
            color: white;
            transition: 0.3s;
            margin-bottom: 15px;
        }
        button:hover { opacity: 0.9; }
        .output-section {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="studio-box">
    <div style="text-align: center;">
        <span class="badge">🔥 جنید سراج & جنید ساؤنڈ - پرو اے آئی اسٹوڈیو</span>
    </div>
    <h1>شیرز پرو اے آئی اسٹوڈیو</h1>
    <div class="subtitle">اصل سازوں اور ترنم کے ساتھ اے آئی گانا اور لیرکس جنریٹر</div>

    <label for="songPrompt">گانے یا شاعری کا موضوع (Prompt):</label>
    <textarea id="songPrompt" rows="3" placeholder="موضوع لکھیں، مثلاً: محبت پر ایک شاندار اور دل کو چھو لینے والا گانا..."></textarea>

    <label for="musicMood">میوزک اور وائس موڈ (Music & Voice Style):</label>
    <select id="musicMood">
        <option value="poetic">📜 شعر و شاعری کا کلاسیکل ترنم</option>
        <option value="sad">🌧️ اداس اور دلگیر دھن (Sad Melody)</option>
        <option value="energetic">🔥 جوشیلہ اور ریتھمک گانا (Energetic Beat)</option>
    </select>

    <button onclick="generateProMusic()">🎵 پرو اے آئی گانا اور ساز جنریٹ کریں</button>

    <div class="output-section">
        <label>تیمار شدہ لیرکس:</label>
        <div id="resultLyrics" style="color: #cbd5e1; white-space: pre-wrap; margin-bottom: 10px; font-size: 15px;">گانا جنریٹ ہونے کے بعد یہاں ظاہر ہوگا...</div>
        
        <label>اصل سازوں کے ساتھ آڈیو پلیئر:</label>
        <audio id="audioPlayer" controls style="display:none;"></audio>
    </div>
</div>

<script>
    async function generateProMusic() {
        let prompt = document.getElementById("songPrompt").value.trim();
        let mood = document.getElementById("musicMood").value;
        let lyricsBox = document.getElementById("resultLyrics");
        let audioPlayer = document.getElementById("audioPlayer");

        if (prompt === "") {
            alert("براہ کرم پہلے گانے کا موضوع درج کریں!");
            return;
        }

        lyricsBox.innerText = "اے آئی اسٹوڈیو ساز اور لیرکس تیار کر رہا ہے، براہ کرم انتظار کریں...";

        try {
            let response = await fetch('/api/generate-pro-music', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt, mood: mood })
            });

            let data = await response.json();
            if (data.success) {
                lyricsBox.innerText = data.lyrics;
                audioPlayer.src = data.audio_url;
                audioPlayer.style.display = "block";
                audioPlayer.play();
            } else {
                alert("جنریشن میں خرابی پیش آئی۔");
            }
        } catch (error) {
            console.error(error);
            alert("سرور سے رابطہ قائم نہیں ہو سکا۔");
        }
    }
</script>

</body>
</html>
