<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اے آئی گانا جنریٹر</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; text-align: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 500px; }
        textarea { width: 90%; height: 100px; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
        button { background-color: #28a745; color: white; border: none; padding: 12px 20px; font-size: 18px; border-radius: 5px; cursor: pointer; width: 95%; }
        button:hover { background-color: #218838; }
        #loading { display: none; margin-top: 15px; color: #007bff; font-weight: bold; }
        audio { margin-top: 20px; width: 95%; }
    </style>
</head>
<body>

<div class="container">
    <h2>اے آئی گانا تیار کرنے والا سسٹم</h2>
    <textarea id="promptInput" placeholder="اپنے گانے کے بول یا خیالات یہاں لکھیں..."></textarea>
    <br>
    <button onclick="generateMusic()">اصلی گانا تیار کریں اور بجائیں</button>
    
    <div id="loading">گانا تیار ہو رہا ہے، براہ کرم انتظار کریں... (اس میں کچھ وقت لگ سکتا ہے)</div>
    
    <br>
    <audio id="audioPlayer" controls style="display:none;"></audio>
</div>

<script>
async function generateMusic() {
    const prompt = document.getElementById('promptInput').value;
    const loadingDiv = document.getElementById('loading');
    const audioPlayer = document.getElementById('audioPlayer');

    if (!prompt.trim()) {
        alert("براہ کرم کچھ بول یا پرامپٹ لکھیں!");
        return;
    }

    loadingDiv.style.display = 'block';
    audioPlayer.style.display = 'none';

    try {
        const response = await fetch('/generate-music', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ prompt: prompt })
        });

        const data = await response.json();
        loadingDiv.style.display = 'none';

        if (data.status === 'success' && data.audio_url) {
            audioPlayer.src = data.audio_url;
            audioPlayer.style.display = 'block';
            audioPlayer.play();
        } else {
            alert("خرابی: " + (data.message || "گانا نہیں بن سکا۔"));
        }
    } catch (error) {
        loadingDiv.style.display = 'none';
        alert("سرور سے رابطہ نہیں ہو سکا یا ٹائم آؤٹ ہو گیا۔");
        console.error(error);
    }
}
</script>

</body>
</html>
